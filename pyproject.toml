[tool.poetry]
name = "wes2024-joint-yaw-induction"
version = "0.2.0"
description = ""
authors = ["Jaime Liew <jaimeliew1@gmail.com>"]
readme = "README.md"
packages = [{ include = "WES2024" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.16.5"
scipy = ">=1.6"
matplotlib = "^3.4"
tqdm = "^4.65.0"
polars = "^0.19.13"
profilehooks = "^1.12.0"
snakeviz = "^2.2.0"
rich = "^13.7.0"
pdir = "^0.2.2"
ffmpeg-python = "^0.2.0"
seaborn = "^0.13.2"
pandas = "^2.2.1"
pyarrow = "^15.0.0"
dualitic = { git = "https://github.com/jaimeliew1/Dualitic.git", rev = "c7e29f4" }
mitwindfarm = { git = "https://github.com/Howland-Lab/MITWindfarm.git", branch = "add-near-wake-length", rev = "4124dd5fcca320ba9736004b9cea313da560faa9" }
mitrotor = { git = "https://github.com/Howland-Lab/MITRotor.git" }
unified-momentum-model = { git = "https://github.com/Howland-Lab/Unified-Momentum-Model.git" }
foreach = "^0.4.0"
bpython = "^0.24"
luigi = "^3.5.1"
# mitwindfarm = { path = "../MITWindfarm", develop = true }
# mitrotor = { path = "../MITRotor", develop = true }
# dualitic = {path = "../Dualitic", develop = true}
altair = "^5.5.0"
vl-convert-python = "^1.7.0"

[tool.poetry.group.dev.dependencies]
pdir2 = "^1.1.0"
mypy = "^1.4.1"
black = { version = "==22.*", extras = ["jupyter"] }
ruff = "^0.1.7"
jupyter = "^1.0.0"
ipython = ">=7.23.1"
ipykernel = "^6.25.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

[tool.black]
line-length = 100