[tool.poetry]
name = "wes2024-joint-yaw-induction"
version = "0.1.0"
description = ""
authors = ["Jaime Liew <jaimeliew1@gmail.com>"]
readme = "README.md"
packages = [{ include = "WES2024" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = ">=1.16.5"
scipy = ">=1.6"
matplotlib = "^3.4"
tqdm = "^4.65.0"
polars = "^0.19.13"
mitwindfarm = { path = "../MITWindfarm", develop = true }
profilehooks = "^1.12.0"
snakeviz = "^2.2.0"
rich = "^13.7.0"
pdir = "^0.2.2"
mitrotor = { path = "../MITRotor", develop = true }
unified-momentum-model = { path = "../Unified-Momentum-Model", develop = true }
ffmpeg-python = "^0.2.0"
dualitic = { path = "../dualitic", develop = true }
seaborn = "^0.13.2"
pandas = "^2.2.1"
pyarrow = "^15.0.0"

[tool.poetry.group.dev.dependencies]
pdir2 = "^1.1.0"
mypy = "^1.4.1"
black = { version = "==22.*", extras = ["jupyter"] }
ruff = "^0.1.7"
jupyter = "^1.0.0"
ipython = ">=7.23.1"
ipykernel = "^6.25.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E402"]

[tool.black]
line-length = 100
